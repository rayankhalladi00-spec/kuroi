<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration — Kuroi</title>
  <link rel="icon" type="image/png" href="/favicon-32.png?v=224fd2e6">
  <link rel="apple-touch-icon" href="/img/logo-source.jpg">
  <link rel="stylesheet" href="/css/style.css?v=224fd2e6">
  <script src="/js/theme.js?v=224fd2e6"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="admin-wrap">
    <h1 style="margin:18px 0 22px">Administration</h1>

    <div class="stats" id="stats"></div>

    <div class="tabs">
      <button class="tab active" data-tab="users">Utilisateurs</button>
      <button class="tab" data-tab="content">Contenu</button>
      <button class="tab" data-tab="avatars">Photos</button>
      <button class="tab" data-tab="logs">Journal</button>
    </div>

    <!-- Utilisateurs -->
    <section id="tab-users">
      <div class="toolbar">
        <input id="userSearch" placeholder="Rechercher un pseudo ou un e-mail…">
        <button class="btn btn-primary btn-sm" id="newUserBtn">+ Nouvel utilisateur</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th><th>Pseudo</th><th>E-mail</th><th>Rôle</th>
              <th>Statut</th><th>Inscrit le</th><th>Dernière connexion</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </section>

    <!-- Contenu -->
    <section id="tab-content" hidden>
      <div class="toolbar">
        <button class="btn btn-primary btn-sm" id="newContentBtn">+ Ajouter un titre</button>
        <button class="btn btn-sm" id="filterIncomplete" type="button" aria-pressed="false">
          Il reste a remplir
        </button>
        <span class="hint" id="contentSummary" style="margin:0"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th><th>Affiche</th><th>Type</th><th>Titre</th><th>Année</th>
              <th>Genre</th><th>Lecteurs</th><th>À la une</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="contentBody"></tbody>
        </table>
      </div>
    </section>

    <!-- Journal -->
    <section id="tab-avatars" hidden>
      <div class="toolbar">
        <label class="btn btn-primary" for="avatarFile" style="cursor:pointer">Ajouter une photo</label>
        <input id="avatarFile" class="visually-hidden" type="file"
               accept="image/png,image/jpeg,image/webp,image/avif,image/gif">
        <span class="hint" style="margin:0">
          Les membres choisissent parmi ces photos. Personne ne televerse la sienne :
          une image par compte remplirait le disque. png, jpg, webp, avif, gif — 2 Mo maximum.
        </span>
      </div>
      <div class="msg" id="avatarMsg"></div>
      <div class="avatar-grid" id="avatarAdminGrid"></div>
    </section>

    <section id="tab-logs" hidden>
      <ul class="log-list" id="logsBody"></ul>
    </section>
  </div>

  <!-- Fenêtre modale générique -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script src="/js/common.js?v=224fd2e6"></script>
  <script src="/js/admin.js?v=224fd2e6"></script>
</body>
</html>
