# Kuroi — proxy vers l'application Node qui écoute sur 127.0.0.1:3000.
# Le domaine kuroi.me pointe deja ici. Certbot a ajoute le bloc HTTPS et la
# redirection : sur le VPS ce fichier est donc plus complet que celui-ci.

server {
    listen 80;
    listen [::]:80;
    server_name kuroi.me www.kuroi.me;

    # Envoi des pièces jointes : la limite doit dépasser MAX_SIZE dans
    # lib/uploads.js (200 Mo), sinon Nginx coupe avant l'application.
    client_max_body_size 210M;
    client_body_timeout 300s;

    access_log /var/log/nginx/kuroi.access.log;
    error_log  /var/log/nginx/kuroi.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /css/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /js/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
