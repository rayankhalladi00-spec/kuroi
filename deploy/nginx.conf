# Kuroi — proxy vers l'application Node qui écoute sur 127.0.0.1:3000.
# Après avoir fait pointer le domaine sur ce serveur :
#   1. remplacer «_» par le domaine dans server_name
#   2. certbot --nginx -d exemple.com -d www.exemple.com
# Certbot réécrit ce fichier pour ajouter le HTTPS et la redirection.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Le lecteur charge des vidéos : laisser passer les gros corps de requête
    # et ne pas couper les lectures longues.
    client_max_body_size 20M;

    access_log /var/log/nginx/kuroi.access.log;
    error_log  /var/log/nginx/kuroi.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /css/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /js/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
